# nginx config for the YRS Toys deployment — three subdomains on one EC2
# box's public IP via sslip.io (no real domain needed yet):
#   yrstoys.54.234.227.84.sslip.io        -> storefront (apps/web, container port 8180)
#   yrstoys-admin.54.234.227.84.sslip.io  -> admin dashboard (apps/admin, container port 8181)
#   yrstoys-api.54.234.227.84.sslip.io    -> API (apps/api, container port 4100)
#
# This is the HTTP-only starting point — certbot rewrites this file in place
# to add the HTTPS server{} blocks and the :80->:443 redirects, exactly like
# it already did for the chatbot-api site on this same box. See DEPLOY.md
# for the exact certbot command.
#
# Install:
#   sudo cp deploy/nginx-yrs-toys.conf /etc/nginx/sites-available/yrs-toys
#   sudo ln -s /etc/nginx/sites-available/yrs-toys /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yrstoys.54.234.227.84.sslip.io -d yrstoys-admin.54.234.227.84.sslip.io -d yrstoys-api.54.234.227.84.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name yrstoys.54.234.227.84.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name yrstoys-admin.54.234.227.84.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name yrstoys-api.54.234.227.84.sslip.io;

    # Product image uploads go through this API (5MB/file limit enforced by
    # the app itself, up to 6 files per request — see
    # apps/api/src/plugins/multipart.ts) — nginx's own 1MB default would
    # reject those requests before they ever reach the app.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
